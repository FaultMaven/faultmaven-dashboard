name: Pin Staleness

# =============================================================================
# ONE ISSUE WHILE THE PINS ARE BEHIND
# =============================================================================
# The copilot-ui pin (package.json) and the API contract pin
# (api-contract.pin.json) move only by a pin-bump pull request. The PR gate
# (ci.yml `copilot-ui-pin`) never fails on staleness by design, so its advisory
# was a NOTE in a green job's log that nobody read. This keeps one open issue,
# labelled `pin-staleness`, in step with the pins: opened when they fall
# behind, rewritten daily while they stay behind, closed when they catch up.
# See scripts/report-pin-staleness.mjs.
#
# A run that cannot read the pins fails and leaves the issue as it was.
#
# Only `main` writes. The schedule, or a dispatch from main, runs the `report`
# job, the one holding `issues: write`. A pull request that edits this workflow
# or its scripts, or a dispatch from any other branch, runs `dry-run` under a
# read-only token: it prints the planned action and could not write if it
# tried. One run at a time, so two overlapping runs cannot both see no issue
# and open two.
#
# GitHub disables a public repository's schedules after 60 days without
# activity; re-enable it from the Actions tab.
# =============================================================================

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pin-staleness.yml'
      - 'scripts/report-pin-staleness.mjs'
      - 'scripts/lib/pin-staleness.mjs'

permissions:
  contents: read

concurrency:
  group: pin-staleness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Pin Staleness
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No pnpm, no install: the script is dependency-free, like the pin gate.
      - name: Set up Node
        uses: FaultMaven/ci-actions/setup-js@6d03d98637a9a4ae9d0d57580408c3299f5d5c0f # v1.3.1
        with:
          pnpm: 'false'
          install: 'false'

      - name: Report the pins in the tracking issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/report-pin-staleness.mjs

  dry-run:
    name: Pin Staleness (dry run)
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: FaultMaven/ci-actions/setup-js@6d03d98637a9a4ae9d0d57580408c3299f5d5c0f # v1.3.1
        with:
          pnpm: 'false'
          install: 'false'

      - name: Print the planned action (writes nothing)
        env:
          # Read-only token: raises the API rate limit, cannot write.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/report-pin-staleness.mjs --dry-run
