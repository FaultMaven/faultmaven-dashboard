name: Brand Lint

# Enforces FaultMaven's canonical product terminology in brand-facing files.
# Source of truth: faultmaven repo, .claude/skills/brand-messaging/SKILL.md (§3/§7).
# Pure Node stdlib — nothing to install.

on:
  pull_request:
    paths:
      # Must list every file the script scans (UNIVERSAL_FILES / CORE_FILES) —
      # a path missing here means the job never runs on the PR that breaks it,
      # and the violation surfaces only on the post-merge push.
      - "README.md"
      - "package.json"
      - "scripts/brand-lint.mjs"
      - ".github/workflows/brand-lint.yml"
  push:
    branches: [main]

# Single job: checks out this repo and runs a stdlib Node script over the
# checked-out files. It writes nothing back and calls no GitHub API.
permissions:
  contents: read

jobs:
  brand-lint:
    runs-on: ubuntu-24.04
    # 60 runs to 2026-10-23: green max 0.3m.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: FaultMaven/ci-actions/setup-js@6d03d98637a9a4ae9d0d57580408c3299f5d5c0f # v1.3.1
        with:
          pnpm: 'false'
          install: 'false'
      - name: Run brand-messaging lint
        run: node scripts/brand-lint.mjs
