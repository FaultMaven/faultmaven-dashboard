name: Publish Docker Image

on:
  # Trigger after CI Pipeline completes; the job's `if:` decides which
  # completed runs publish
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  # A version tag or a manual run publishes only a commit whose CI passed on a
  # push: see "Require a green CI run".
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: faultmaven-dashboard

jobs:
  publish:
    runs-on: ubuntu-24.04
    # 58 runs to 2026-10-23: green max 2.2m on a warm cache; a cold build and the Trivy DB download take longer.
    timeout-minutes: 20
    # A tag push or a manual run publishes once "Require a green CI run"
    # passes. A CI run publishes only when it
    # passed on a push (#235): `branches: [main]` above matches the triggering
    # run's HEAD branch, so a fork PR from a branch named main reaches this
    # job too, and a dispatched CI run can skip its tests and still conclude
    # success. `event == 'push'` is what keeps both out. A push run's head
    # repository is always this one, so the head_repository clause only
    # restates it.
    if: >-
      ${{ (github.event_name == 'workflow_run'
           && github.event.workflow_run.conclusion == 'success'
           && github.event.workflow_run.event == 'push'
           && github.event.workflow_run.head_repository.full_name == github.repository)
          || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
      actions: read  # the CI-verdict lookup for a tag or a dispatch
    env:
      # The commit this run builds, tags and queues. Under workflow_run,
      # github.sha is main's head when the event fires, not the commit whose
      # CI passed: once main has moved on they differ (#235). That commit is
      # the run's head_sha. A tag push or a manual run builds github.sha.
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The Dockerfile's apk layer is keyed on PKG_REFRESH (#236). A
      # workflow_run passes the key of the CI run that passed, in ci.yml's
      # form, so the build usually restores that run's layer from the GHA
      # cache, and re-running this workflow republishes the same packages.
      # Usually, not always: BuildKit's gha index holds only the last export,
      # so another build exported since, an eviction or a moved nginx:alpine
      # makes it upgrade again. A tag push or a manual run, which no CI run
      # precedes, upgrades under its own key. Either way the scan below is
      # what every pushed image passes.
      PKG_REFRESH: ${{ github.event.workflow_run.id || github.run_id }}-${{ github.event.workflow_run.run_attempt || github.run_attempt }}

    steps:
      # A tag push or a manual run carries no CI verdict of its own, so it
      # publishes only a commit with a green "CI Pipeline" run from a PUSH
      # (FaultMaven/faultmaven#2185 added the same gate in core). A dispatched
      # CI run does not count: it can skip its tests and still succeed. A
      # mistyped tag target is refused, not shipped. A workflow_run already is
      # that verdict.
      - name: Require a green CI run
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          green="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${BUILD_SHA}&event=push&status=success&per_page=100" \
            --jq '.workflow_runs | length')"
          if [ "$green" -eq 0 ]; then
            echo "::error::${BUILD_SHA} has no successful CI Pipeline run from a push; refusing to publish it"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login to GHCR (GitHub Container Registry)
      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `tag` is sha-<first 7>, the tag metadata-action's type=sha writes, but
      # of BUILD_SHA. type=sha reads github.sha under the default
      # `context: workflow`; `context: git` reads the checkout instead, and
      # stops on the shallow detached one above ("Cannot find detached HEAD
      # ref in "grafted, HEAD""). The queue step names the image by this same
      # output.
      #
      # `image` is the repository as metadata-action writes it, lowercased:
      # the owner is `FaultMaven`, and an image reference must be lowercase.
      # The scan and the pushed-image check read it.
      #
      # `head` says whether BUILD_SHA is the head of github.ref NOW, read
      # from the remote just before the build. github.sha cannot say it: it is
      # fixed when the event fires, and a re-run keeps it.
      - name: Resolve the commit's tags
        id: commit
        run: |
          echo "tag=sha-${BUILD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          head="$(git ls-remote origin "$GITHUB_REF" | awk -v ref="$GITHUB_REF" '$2 == ref { print $1 }')"
          if [ "$head" = "$BUILD_SHA" ]; then
            echo "head=true" >> "$GITHUB_OUTPUT"
          else
            echo "head=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF} is at ${head:-nothing}, not ${BUILD_SHA}: this run writes no branch tag and no latest."
          fi

      # Extract metadata for Docker tags and labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # `latest` names main's head and the branch tag its branch's head, so
          # only a run whose commit is that head when it builds writes them. A
          # CI run whose commit main has moved past (one that finished after a
          # newer commit's, or a re-run of an old one) publishes its sha- tag
          # alone. `latest` waits while main's head has no passing CI.
          #
          # latest=false: by default metadata-action also adds `latest` to a
          # semver tag push, on whatever commit the tag names.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && steps.commit.outputs.head == 'true' }}
            type=ref,event=branch,enable=${{ steps.commit.outputs.head == 'true' }}
            type=raw,value=${{ steps.commit.outputs.tag }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # metadata-action fills this label from github.sha too.
          labels: |
            org.opencontainers.image.revision=${{ env.BUILD_SHA }}

      # Build into the runner's Docker, scan it, then push it (#236). The push
      # step rebuilds from this builder's own cache, so it pushes the layers
      # just scanned, and the step after it checks that it did. What this run
      # pushes has passed the scan, whatever the GHA cache handed back.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PKG_REFRESH=${{ env.PKG_REFRESH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # The same gate as ci.yml's build job.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ steps.commit.outputs.image }}:${{ steps.commit.outputs.tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PKG_REFRESH=${{ env.PKG_REFRESH }}
          cache-from: type=gha
          platforms: linux/amd64

      # The pushed image's layers (its config's diff_ids) must be the scanned
      # image's. A rebuild that missed the builder's cache would differ here.
      # The tags are already pushed by then, so this turns the run red before
      # the queue step: the queue never names an unscanned image.
      - name: Check the pushed image is the scanned one
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.commit.outputs.image }}
          TAG: ${{ steps.commit.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          scanned="$(docker image inspect "${IMAGE}:${TAG}" --format '{{json .RootFS.Layers}}' | tr -d ' \n')"
          pushed="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Image.RootFS.DiffIDs}}' | tr -d ' \n')"
          if [ -z "$scanned" ] || [ "$scanned" != "$pushed" ]; then
            echo "::error::${IMAGE}@${DIGEST} does not hold the layers Trivy scanned in ${IMAGE}:${TAG}."
            exit 1
          fi
          echo "${IMAGE}@${DIGEST} holds the $(echo "$scanned" | tr ',' '\n' | wc -l) layers Trivy scanned."

      # `digest` comes from build-push-action, NOT metadata-action — the latter
      # emits tags/labels/version/json and no digest at all, so this line
      # printed "with digest " and nothing else for as long as it existed. It
      # reads like provenance and carried none.
      #
      # This is the one the actionlint gate added in this change actually
      # caught, and will catch again: metadata-action is pinned @v5 here, whose
      # output set actionlint knows. The identical bug in faultmaven is
      # invisible to the same gate because that repo is on @v6.
      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Published Docker images with digest ${{ steps.build.outputs.digest }}"

      # Cross-repo queue update authenticates via the faultmaven-infra-queue-bot
      # GitHub App (org INFRA_BOT_APP_ID / INFRA_BOT_PRIVATE_KEY), minting a
      # short-lived token scoped to faultmaven-enterprise-infra. The image is
      # already pushed above; if the App credentials are missing or wrong the
      # mint step fails and the job goes RED — the queue can no longer silently
      # fall behind (which once stranded the dashboard on a stale pin). Queue
      # updates run only for main, as in the other service repos, and only on
      # the canonical repo; forks (no org creds) skip with a note.
      - name: Mint infra token (GitHub App)
        id: infra-token
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven-dashboard'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.INFRA_BOT_APP_ID }}
          private-key: ${{ secrets.INFRA_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: faultmaven-enterprise-infra

      - name: Note skipped queue update (fork)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository != 'FaultMaven/faultmaven-dashboard'
        run: |
          echo "::warning::Not the canonical repo — skipping enterprise-infra image queue update (expected on forks)."

      # The image queue moved to enterprise-infra's `image-queue` branch
      # (infra#408). This step checks out that branch, and the next one pushes it.
      - name: Checkout enterprise-infra
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven-dashboard'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: FaultMaven/faultmaven-enterprise-infra
          ref: image-queue
          token: ${{ steps.infra-token.outputs.token }}
          path: enterprise-infra

      - name: Install yq
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven-dashboard'
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
          # A release asset can be replaced after it ships, and this job holds
          # packages: write and the infra app token. The hash is the release's
          # own `checksums` entry for this file.
          echo "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # The queue only moves forward (infra#413). This run replaces the queued
      # entry only when its commit CONTAINS the queued one; GitHub's compare of
      # this repository, queued...this run, decides:
      #   ahead      this run is newer                 -> write
      #   identical  the queue already names it        -> skip
      #   behind     this run is older (an old rerun)  -> skip
      #   diverged   neither contains the other        -> refuse: a red run, for a person
      #   no answer  (the compare failed or said else) -> retry, then a red run
      # Only an unseeded entry (no tag and no commit_sha) is written without a
      # compare. An entry the rule cannot order (a commit_sha that is not hex,
      # a tag naming another commit, no commit at all) is refused, and so is a
      # missing queue file. A refusal writes nothing: a person fixes the entry.
      # Four repositories push this branch, so a push rejected as `fetch first`
      # or `non-fast-forward`, or lost at the server's ref lock, is an ordinary
      # race. It RE-READS origin's file and
      # decides again, so the last writer has always compared against the
      # newest entry. Any other push failure is red. It never rebases: two runs
      # of one repository rewrite the same three lines, and that rebase stops on
      # a conflict.
      - name: Update image queue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'FaultMaven/faultmaven-dashboard'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.commit.outputs.tag }}
          TRIGGERED_BY: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          cd enterprise-infra
          git config user.name "faultmaven-infra-queue-bot[bot]"
          git config user.email "faultmaven-infra-queue-bot[bot]@users.noreply.github.com"

          QUEUE_FILE="available-images/staging/faultmaven-dashboard.yaml"
          RUN_SHA="$BUILD_SHA"
          TAG="$IMAGE_TAG"
          REPO="$GITHUB_REPOSITORY"
          COMMIT_MSG="chore(queue): update faultmaven-dashboard image to ${TAG}

          Built from: ${REPO}@${RUN_SHA}
          Triggered by: @${TRIGGERED_BY}
          Workflow: ${WORKFLOW_NAME}"
          GHCR="GHCR holds ${TAG} but the queue does not name it."
          HEX='^[0-9a-fA-F]{7,40}$'
          SHA_TAG='^sha-([0-9a-fA-F]{7,40})$'
          RACE='^ ! \[rejected\] .*\((fetch first|non-fast-forward)\)'
          RACE_LOCK='^ ! \[remote rejected\] .*\((incorrect old value provided|cannot lock ref[^)]*|failed to update ref)\)'
          ERR="$(mktemp)"
          trap 'rm -f "$ERR"' EXIT

          # Every value printed into a :: command or the step summary goes
          # through flat(): CR, LF and tab become spaces, so no value can start
          # a line of its own.
          flat() {
            local s="$1"
            s="${s//$'\r'/ }"
            s="${s//$'\n'/ }"
            s="${s//$'\t'/ }"
            printf '%s' "$s"
          }
          annotate() {
            printf '::%s::%s\n' "$1" "$(flat "$2")"
          }
          # The FIRST non-blank stderr line of gh, git or yq, without gh's
          # "gh: " prefix. gh's later lines are hints, not the error. Trailing
          # blanks are cut: git pads a "remote: " line with spaces.
          first_err() {
            awk 'NF { sub(/^gh: /, ""); sub(/[ \t\r]+$/, ""); print; exit }' "$ERR"
          }
          # The line of a failed push that says why, trimmed: the first " ! "
          # status line, else the first "remote: " line with text after the
          # prefix, else the first "fatal: " or "error: " line, else the first
          # non-blank line.
          push_err() {
            local line
            line="$(awk '/^ ! / { print; exit }' "$ERR")"
            [ -n "$line" ] || line="$(awk '/^remote: *[^ \t\r]/ { print; exit }' "$ERR")"
            [ -n "$line" ] || line="$(awk '/^(fatal|error): / { print; exit }' "$ERR")"
            [ -n "$line" ] || line="$(awk 'NF { print; exit }' "$ERR")"
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            printf '%s' "$line"
          }

          # Sets DECISION (write, skip, refuse or retry), REASON and DETAIL from
          # the queue entry as it stands, and Q to the commit it names.
          decide() {
            local rc status sha tag
            DECISION=""
            REASON=""
            DETAIL=""
            Q=""
            # select(. != null), not // "": yq's // also replaces false, which
            # would read a boolean entry as unseeded.
            if ! sha="$(yq '.commit_sha | select(. != null)' "$QUEUE_FILE" 2>"$ERR")" ||
               ! tag="$(yq '.tag | select(. != null)' "$QUEUE_FILE" 2>"$ERR")"; then
              DECISION="retry"
              REASON="could not read ${QUEUE_FILE}: $(first_err)"
              return 0
            fi
            DETAIL="${QUEUE_FILE} has tag '${tag}' and commit_sha '${sha}'"
            if [ -z "$sha" ] && [ -z "$tag" ]; then
              DECISION="write"   # unseeded: nothing to order against
              return 0
            fi
            if [ -n "$sha" ]; then
              if ! [[ $sha =~ $HEX ]]; then
                DECISION="refuse"
                REASON="the queued commit_sha is not a commit sha"
                return 0
              fi
              # They agree when either hex is a case-insensitive prefix of the other.
              if [ -n "$tag" ] && { ! [[ $tag =~ $SHA_TAG ]] ||
                   [[ ${sha,,} != "${BASH_REMATCH[1],,}"* && ${BASH_REMATCH[1],,} != "${sha,,}"* ]]; }; then
                DECISION="refuse"
                REASON="the queued tag and commit_sha name different commits"
                return 0
              fi
              Q="$sha"
            elif [[ $tag =~ $SHA_TAG ]]; then
              Q="${BASH_REMATCH[1]}"
            else
              DECISION="refuse"
              REASON="the queue entry names no commit this rule can order"
              return 0
            fi
            if [ "$Q" = "$RUN_SHA" ]; then
              DECISION="skip"
              REASON="the queue already names this commit"
              return 0
            fi
            # gh's rc is read before its answer: a 404 prints its JSON body on
            # stdout. per_page=1: only .status is read, not the commit list.
            rc=0
            status="$(gh api "repos/${REPO}/compare/${Q}...${RUN_SHA}?per_page=1" --jq .status 2>"$ERR")" || rc=$?
            if [ "$rc" -ne 0 ]; then
              DECISION="retry"
              REASON="the compare ${Q}...${RUN_SHA} failed: $(first_err)"
              return 0
            fi
            case "$status" in
              ahead)     DECISION="write" ;;
              identical) DECISION="skip";   REASON="the queued ${Q} is this commit" ;;
              behind)    DECISION="skip";   REASON="this run's commit is older than the queued ${Q}" ;;
              diverged)  DECISION="refuse"; REASON="neither commit contains the other"
                         DETAIL="${QUEUE_FILE} names ${Q} and this run is ${RUN_SHA}" ;;
              *)         DECISION="retry";  REASON="the compare ${Q}...${RUN_SHA} answered '${status}'" ;;
            esac
          }

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ] && ! { git fetch -q origin image-queue && git reset -q --hard FETCH_HEAD; }; then
              REASON="could not re-read origin/image-queue"
              annotate warning "${REASON} (attempt ${attempt}/3)"
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
              continue
            fi
            # Not transient, so not retried.
            if [ ! -f "$QUEUE_FILE" ]; then
              annotate error "Queue file not found: ${QUEUE_FILE} on image-queue - register the service first. ${GHCR}"
              exit 1
            fi
            decide
            case "$DECISION" in
              skip)
                annotate notice "${REASON}; the queue keeps ${Q} in ${QUEUE_FILE}"
                {
                  echo "## Image queue"
                  echo ""
                  printf '%s\n' "$(flat "\`${QUEUE_FILE}\` is unchanged: ${REASON}. It keeps \`${Q}\`; this run is \`${RUN_SHA}\`.")"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              refuse)
                annotate error "${REASON}: ${DETAIL}. The queue is left as it is. ${GHCR}"
                exit 1
                ;;
              retry)
                annotate warning "${REASON} (attempt ${attempt}/3)"
                if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
                ;;
              write)
                echo "Updating ${QUEUE_FILE} to ${TAG}"
                if ! { yq -i ".tag = \"${TAG}\"" "$QUEUE_FILE" &&
                       yq -i ".updated_at = \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" "$QUEUE_FILE" &&
                       yq -i ".commit_sha = \"${RUN_SHA}\"" "$QUEUE_FILE" &&
                       git add "$QUEUE_FILE" &&
                       git commit -q -m "$COMMIT_MSG"; }; then
                  annotate error "could not write ${QUEUE_FILE} in the checkout. ${GHCR}"
                  exit 1
                fi
                rc=0
                git push origin image-queue 2>"$ERR" || rc=$?
                cat "$ERR" >&2
                if [ "$rc" -eq 0 ]; then
                  echo "✓ Updated image queue: ${TAG}"
                  exit 0
                fi
                if ! grep -Eq -e "$RACE" -e "$RACE_LOCK" "$ERR"; then
                  annotate error "the push to image-queue failed, not as a race: $(push_err). ${GHCR}"
                  exit 1
                fi
                REASON="the push to image-queue was rejected"
                annotate warning "push rejected; recomputing against origin/image-queue (attempt ${attempt}/3)"
                ;;
            esac
          done
          annotate error "could not update the queue after 3 attempts: ${REASON}. ${GHCR}"
          exit 1
