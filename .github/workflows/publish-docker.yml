name: Publish Docker Image

on:
  # Trigger after CI workflow completes successfully on main branch
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  # Also trigger on version tags
  push:
    tags: [ 'v*.*.*' ]
  # Manual trigger for emergency releases
  workflow_dispatch:

env:
  REGISTRY_DOCKER: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: faultmaven-dashboard

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only publish if CI workflow succeeded (or if triggered by tag/manual)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    env:
      # Cross-repo queue update is soft-gated: it runs only when the PAT is
      # configured. Without it, the image still publishes; the enterprise-infra
      # queue update is just skipped.
      HAS_INFRA_TOKEN: ${{ secrets.PAT_CROSS_REPO_ACCESS != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login to Docker Hub
      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Login to GHCR (GitHub Container Registry)
      - name: Log into GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for Docker tags and labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_DOCKER }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Add image digest to job summary
      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Published Docker images with digest ${{ steps.meta.outputs.digest }}"

      - name: Note skipped queue update
        if: github.event_name != 'pull_request' && env.HAS_INFRA_TOKEN != 'true'
        run: |
          echo "::warning::PAT_CROSS_REPO_ACCESS is not set — skipping enterprise-infra image queue update."
          echo "Set the PAT_CROSS_REPO_ACCESS secret to enable automatic queue updates."

      # Checkout enterprise-infra repository to update image queue
      - name: Checkout enterprise-infra
        if: github.event_name != 'pull_request' && env.HAS_INFRA_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: FaultMaven/faultmaven-enterprise-infra
          ref: main
          token: ${{ secrets.PAT_CROSS_REPO_ACCESS }}  # Design docs call this INFRA_REPO_TOKEN
          path: enterprise-infra

      - name: Install yq
        if: github.event_name != 'pull_request' && env.HAS_INFRA_TOKEN == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image queue
        if: github.event_name != 'pull_request' && env.HAS_INFRA_TOKEN == 'true'
        run: |
          cd enterprise-infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          QUEUE_FILE="available-images/staging/faultmaven-dashboard.yaml"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          TAG="sha-${SHA_SHORT}"

          echo "Updating $QUEUE_FILE with tag: $TAG"
          yq -i ".tag = \"${TAG}\"" "$QUEUE_FILE"
          yq -i ".updated_at = \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" "$QUEUE_FILE"
          yq -i ".commit_sha = \"${GITHUB_SHA}\"" "$QUEUE_FILE"

          git add "$QUEUE_FILE"
          if git diff --staged --quiet; then
            echo "No changes to queue file"
          else
            git commit -m "chore(queue): update faultmaven-dashboard image to ${TAG}

          Built from: ${{ github.repository }}@${GITHUB_SHA}
          Triggered by: @${{ github.actor }}
          Workflow: ${{ github.workflow }}"
            git push origin main
            echo "✓ Updated dashboard image queue: ${TAG}"
          fi
