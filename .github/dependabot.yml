# Dependabot configuration.
#
# One entry: new releases of the sha-pinned GitHub Actions. npm dependencies
# are covered by the lockfile audit in ci.yml and scheduled-audit.yml, not by
# version updates here.
version: 2
updates:
  # Every action in .github/workflows/ is pinned to a commit sha, as in
  # FaultMaven/faultmaven#2185. Dependabot raises no security alert for an
  # action pinned that way, so this entry is the only signal that one has a
  # new release, fixes included. It updates the sha and the version comment
  # together. At most two pull requests a week: majors are grouped apart, so a
  # breaking major cannot hold back a patch.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
