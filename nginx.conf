server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # ----------------------------------------------------------------------------
    # Security headers.
    #
    # IMPORTANT: nginx's add_header is NOT additive across levels. The moment a
    # `location` block defines even ONE add_header of its own, it DISCARDS every
    # add_header inherited from this server block. Every location below therefore
    # sets Cache-Control AND must re-declare the full security-header set, or those
    # responses (config.js, hashed assets, /health) ship with NO security headers.
    # If you touch one copy, touch them all. (X-XSS-Protection is intentionally "0":
    # the legacy auditor is deprecated and has itself caused vulnerabilities.)
    # ----------------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none';" always;

    # SPA routing - serve index.html for all routes.
    # index.html must never be cached: after a redeploy the old shell references
    # purged hashed bundles, so a cached shell = white screen. no-cache forces a
    # revalidation on every load while still allowing a 304 when unchanged.
    location / {
        try_files $uri $uri/ /index.html;

        # Re-declare security headers (see note above) + no-cache for the shell.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none';" always;
        add_header Cache-Control "no-cache" always;
    }

    # Runtime config (window.ENV). Stable filename, MUTABLE content — rewritten at
    # container startup by inject-config.sh and changes whenever VITE_API_URL does.
    # It must NOT be cached, or a browser would pin a stale API URL after a redeploy
    # (the immutable rule below would otherwise match /config.js and hold it 1 year).
    # Exact-match location takes priority over the regex block regardless of order.
    location = /config.js {
        # Re-declare security headers (see note above).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none';" always;

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Cache static assets (content-hashed bundle filenames — safe to keep forever)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Re-declare security headers (see note above).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none';" always;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Health check endpoint
    location /health {
        access_log off;

        # Re-declare security headers (see note above).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none';" always;

        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}
