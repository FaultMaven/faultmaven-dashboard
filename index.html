<!DOCTYPE html>
<!--
  data-faultmaven-dashboard-panel: this build renders the Copilot panel itself,
  so the extension yields its side panel on this origin (ADR-016 D4; contract
  settled in faultmaven-copilot#231). It is a claim about the BUILD, not about
  the account, the route or what is on screen — which is why it is
  unconditional here and lives in the initial HTML: a content script at
  document_start has to be able to answer before React exists. A build without
  the panel ships this same markup with a falsy value ("", "false" or "0").
  See src/copilot/advertisement.ts for the predicate and the matching window
  message.
-->
<html lang="en" data-faultmaven-dashboard-panel="1">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon/square-dark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaultMaven Dashboard</title>
    <!-- Runtime config (window.ENV). Classic script: runs before the deferred app
         module, so src/config.ts sees window.ENV. Overwritten at container startup
         by inject-config.sh; ships as an empty stub for dev/static builds. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
