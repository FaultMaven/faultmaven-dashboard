<!DOCTYPE html>
<!--
  data-faultmaven-dashboard-panel: this build renders the Copilot panel itself,
  but the flag is deliberately OFF ("0" is one of the contract's three
  non-advertising values, which exist so a build can ship this markup with the
  flag down).

  WHY OFF, when this build does host a panel. An extension that predates
  faultmaven-copilot#257 yields on THIS ATTRIBUTE at document_end and cannot
  hear the withdrawal that would release it — so it hides its side panel on a
  Dashboard that may then show none, leaving the tab with neither surface.
  Measured against the pre-#257 build. The live `FM_DASHBOARD_PANEL_AVAILABLE`
  message is version-gated in `src/copilot/copilotCapability.ts` for the same
  reason, and gating only the message leaves this path open — both had to close.

  An extension carrying #257 does not read this attribute at all (ADR-018 D0
  row 7 removed that read), so nothing is lost today. Flip it back to "1", or
  delete the whole migration, together with COPILOT_WITHDRAWAL_MIN_VERSION once
  no install below that version is plausibly in the field.

  The contract itself is faultmaven-copilot#231, settled in
  `@faultmaven/copilot-ui/contract`: the attribute is a claim about the BUILD —
  not about the account, the route or what is on screen — which is why it lives
  in the initial HTML, where a content script at document_start can answer
  before React exists. What IS on screen travels as the window message; see
  src/copilot/advertisement.ts for both.
-->
<html lang="en" data-faultmaven-dashboard-panel="0">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon/square-dark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaultMaven Dashboard</title>
    <!-- Runtime config (window.ENV). Classic script: runs before the deferred app
         module, so src/config.ts sees window.ENV. Overwritten at container startup
         by inject-config.sh; ships as an empty stub for dev/static builds. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
